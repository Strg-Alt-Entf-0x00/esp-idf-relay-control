name: ESP-IDF

on:
  push:
  pull_request:

jobs:
  build-esp32p4:
    name: Build ESP32-P4 examples and tests
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build console example
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd examples/console_relay
          idf.py set-target esp32p4
          idf.py build

      - name: Build Unity test application
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd test_apps/relay_controller
          idf.py set-target esp32p4
          idf.py build

      - name: Run host mock tests
        shell: bash
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Ihost_tests/stubs -Iinclude \
            host_tests/test_relay_controller.c \
            -o /tmp/relay_controller_host_tests
          /tmp/relay_controller_host_tests
